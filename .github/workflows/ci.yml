name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate seed JSON
        run: for f in data/seed/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: Project rules + formatting
        run: npm run lint
      - name: Type check (astro check)
        run: npm run check
      - name: Unit tests (API against the seeded database)
        run: npm test
      - name: Build Worker
        run: npm run build
      - name: Size budgets
        run: npm run size

  e2e:
    name: E2E + layout (390px and 1440px)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Seed local D1 (no cloud resources)
        run: npm run setup
      - name: Throwaway admin and account credentials for the signed-in tests
        # Generated per run; never stored. .dev.vars is gitignored.
        run: |
          ADMIN_PASSWORD="ci-$(openssl rand -hex 12)"
          echo "::add-mask::$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\nADMIN_SESSION_SECRET=%s\nIP_HASH_SALT=%s\n' "$ADMIN_PASSWORD" "$(openssl rand -hex 32)" "$(openssl rand -hex 16)" > .dev.vars
          # Accounts: local dev sign-in and a throwaway webhook secret (no Whop app, no live keys).
          printf 'USER_SESSION_SECRET=%s\nDEV_SIGN_IN=1\nWHOP_WEBHOOK_SECRET=ws_ci_%s\nWHOP_PRO_PRODUCT_ID=prod_CIPRO\nWHOP_TEAM_PRODUCT_ID=prod_CITEAM\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" >> .dev.vars
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Worker
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
