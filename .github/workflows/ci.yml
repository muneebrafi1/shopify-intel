# Placeholder CI. Claude Code should replace this with real checks (install, typecheck,
# lint, unit tests, build, and optionally Playwright smoke + size budgets) once the app exists.
name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate seed JSON
        run: |
          for f in data/seed/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
          echo "seed ok"
      - name: Build (if package.json exists)
        run: |
          if [ -f package.json ]; then
            corepack enable || true
            (npm ci || npm install) && npm run --if-present lint && npm run --if-present typecheck && npm run --if-present test && npm run --if-present build
          else
            echo "no app yet"
          fi
